# Limit logów każdego kontenera: 3 pliki po 10 MB, starsze są usuwane.
# Domyślnie Docker trzyma logi bez limitu, a zapis na kartę SD jest ciągły.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15-alpine
    # Ustawienia dobrane do Raspberry Pi 4 (2 GB RAM, karta SD) i małej bazy.
    # Zmienna POSTGRES_MAX_CONNECTIONS, która tu była, nie istnieje w obrazie
    # postgres i nic nie robiła - parametry serwera podaje się przez -c.
    #   max_connections      gunicorn trzyma najwyżej 8 połączeń, reszta to
    #                        crony, psql i zapas
    #   shared_buffers       cała baza (dziesiątki MB) mieści się w pamięci
    #   wal_compression,
    #   checkpoint_timeout,
    #   max_wal_size         rzadsze i mniejsze zapisy na kartę SD
    #   random_page_cost     karta/SSD nie ma kosztownego "szukania" jak dysk
    # synchronous_commit zostaje włączone: zanik prądu nie gubi zapisów.
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_compression=on
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=512MB
      - -c
      - random_page_cost=1.1
    # Poświadczenia pochodzą z .env (ten sam plik, z którego czyta je Django),
    # więc nie mogą się rozjechać i nie trafiają do repozytorium.
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-finance_db}
      POSTGRES_USER: ${DATABASE_USER:-finance}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Ustaw DATABASE_PASSWORD w pliku .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Tylko localhost hosta. Baza nie jest wystawiona na sieć domową;
      # z Pi łączysz się przez `docker compose exec db psql` albo tunel SSH.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    logging: *default-logging

  web:
    build: .
    # collectstatic jest w Dockerfile (raz, przy buildzie). Gunicorn:
    #   --workers 2 --threads 4  do 8 żądań naraz przy ~2 procesach w RAM
    #   --preload                kod ładuje się raz przed rozdzieleniem na
    #                            workery: wspólna pamięć, szybszy restart
    #   --max-requests 1000      worker odświeża się co ~1000 żądań, zanim
    #   --max-requests-jitter    urośnie mu pamięć (jitter: nie oba naraz)
    # Bez logu dostępu: każde żądanie (także co 30 s synchronizacja listy
    # zakupów) było zapisem na kartę. Błędy dalej trafiają do `docker compose logs web`.
    command: >-
      sh -c "python manage.py migrate --noinput
      && exec gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 2 --threads 4
      --preload
      --max-requests 1000 --max-requests-jitter 100
      --timeout 60 --graceful-timeout 30 --keep-alive 5
      --error-logfile - --log-level warning"
    volumes:
      - ./media:/app/media
      - ./private_media:/app/private_media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      # Ruch przez Caddy przychodzi jako HTTP z nagłówkiem X-Forwarded-Proto.
      # Bez tego Django uznałby połączenie HTTPS za zwykłe i odrzucał
      # formularze (Origin https://... nie pasowałby do http://...).
      BEHIND_HTTPS_PROXY: "1"
    depends_on:
      db:
        condition: service_healthy
    # /healthz (config/health.py): Django odpowiada i baza działa.
    # `docker compose ps` pokazuje wtedy "healthy", a update.sh na to czeka.
    # start_period: czas na migracje po aktualizacji.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    # Czas na dokończenie trwających żądań (np. importu wyciągu) przy
    # zatrzymaniu; domyślne 10 s ucinało je wcześniej niż --graceful-timeout.
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  # HTTPS przed aplikacją - bez niego przeglądarka nie udostępni aparatu
  # skanerowi spiżarni. Konfiguracja i opis: deploy/Caddyfile, README
  # ("HTTPS i aparat w skanerze"). Uruchomienie na Raspberry Pi:
  #   docker compose up -d --build web caddy
  caddy:
    image: caddy:2-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Adresy, pod którymi otwieracie stronę; certyfikat obejmie każdy z nich.
      HTTPS_SITES: ${HTTPS_SITES:-raspberrypi.local, 192.168.1.115}
      # Adres IP Pi (ten sam co w HTTPS_SITES) - dla przeglądarek łączących
      # się po IP, które nie podają nazwy serwera. Patrz deploy/Caddyfile.
      HTTPS_IP: ${HTTPS_IP:-192.168.1.115}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/https-setup:/srv/https-setup:ro
      # Lokalny urząd certyfikacji. Nie usuwaj tego wolumenu - nowy urząd
      # oznacza ponowną instalację certyfikatu na każdym telefonie.
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging: *default-logging

  web-dev:
    build: .
    # Bez `makemigrations`: w kontenerze nowe migracje zapisywałyby się do
    # warstwy obrazu i ginęły przy przebudowie, a baza zostawała zmigrowana do
    # stanu, którego nie ma w repozytorium. Migracje generuj świadomie:
    #   docker compose run --rm web-dev python manage.py makemigrations
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      # Kod NIE jest montowany z hosta. Gdy repozytorium leży w iCloud Drive
      # (albo innym File Providerze), pliki niepobrane lokalnie są tylko
      # placeholderami i odczyt przez mount Dockera kończy się błędem
      # "OSError: [Errno 35] Resource deadlock avoided". Kod trafia do obrazu
      # przez COPY podczas builda, co działa niezależnie od iCloud.
      #
      # Podgląd zmian na żywo: patrz docker-compose.override.yml opisany
      # w README (tylko dla repozytorium poza iCloud Drive).
      - ./media:/app/media
      - ./private_media:/app/private_media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web-test:
    build: .
    command: sh -c "python manage.py test -v 3"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
        
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
