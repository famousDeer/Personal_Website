{% extends 'cooking/index.html' %}
{% load pantry_extras %}

{% block title %}Dodaj produkt do spiżarni{% endblock %}

{% block content_cooking %}
<div class="row justify-content-center">
    <div class="col-lg-7 col-xl-6">
        <div class="text-center mb-4 animate-fade-in">
            <div class="icon-box bg-success-subtle text-success mx-auto mb-3 shadow-sm"
                 style="width: 70px; height: 70px; font-size: 2rem; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <i class="bi bi-box-seam"></i>
            </div>
            <h2 class="fw-bold mb-1 recipe-title">Nowy produkt</h2>
            <p class="text-muted small mb-0">Dodaj zapas i próg uzupełnienia.</p>
        </div>

        <div class="card border-0 shadow-lg action-card animate-fade-in-up">
            <div class="card-body p-4 p-md-5">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control fs-5 fw-bold" id="name" name="name"
                               value="{{ form_values.name|default:'' }}" placeholder="Nazwa" required>
                        <label for="name">Nazwa produktu</label>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-7">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="barcode" name="barcode"
                                       inputmode="numeric" autocomplete="off"
                                       value="{{ form_values.barcode|default:'' }}" placeholder="Kod kreskowy">
                                <label for="barcode">Kod kreskowy (opcjonalnie)</label>
                            </div>
                        </div>
                        <div class="col-md-5">
                            <div class="form-floating">
                                <input type="number" step="1" min="0.01" class="form-control"
                                       id="quantity-per-scan" name="quantity_per_scan"
                                       data-pantry-quantity-input
                                       value="{{ form_values.quantity_per_scan|default:'1' }}" required>
                                <label for="quantity-per-scan">Ilość na skan</label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small text-uppercase fw-bold text-muted ms-1" for="pantry-product-image">
                            Zdjęcie produktu (opcjonalnie)
                        </label>
                        <label class="pantry-photo-capture" for="pantry-product-image">
                            <i class="bi bi-camera-fill" aria-hidden="true"></i>
                            <span>
                                <strong>Zrób zdjęcie lub wybierz plik</strong>
                                <small>JPG, PNG albo WEBP, maksymalnie 5 MB</small>
                            </span>
                        </label>
                        <input class="visually-hidden" id="pantry-product-image" type="file" name="image"
                               accept="image/jpeg,image/png,image/webp" capture="environment">
                    </div>

                    <div class="row g-3">
                        <div class="col-md-7">
                            <div class="form-floating">
                                <select class="form-select" id="category" name="category">
                                    <option value="">Bez kategorii</option>
                                    {% pantry_category_options form_values.category %}
                                </select>
                                <label for="category">Kategoria</label>
                            </div>
                        </div>
                        <div class="col-md-5">
                            <div class="form-floating">
                                <select class="form-select" id="unit" name="unit" required data-pantry-unit-select>
                                    {% for value, label in units %}
                                        <option value="{{ value }}" {% if form_values.unit == value %}selected{% endif %}>{{ label }}</option>
                                    {% endfor %}
                                </select>
                                <label for="unit">Jednostka</label>
                            </div>
                        </div>
                    </div>

                    <div class="row g-3 mt-1">
                        <div class="col-md-6">
                            <label class="form-label small text-uppercase fw-bold text-muted ms-1">Liczba opakowań / sztuk</label>
                            <input type="number" step="1" min="0" class="form-control form-control-lg"
                                   name="current_package_count" value="{{ form_values.current_package_count|default:'0' }}"
                                   data-pantry-package-count required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small text-uppercase fw-bold text-muted ms-1">Łączna ilość</label>
                            <input type="number" step="1" min="0" class="form-control form-control-lg"
                                   data-pantry-quantity-input
                                   data-pantry-total-quantity
                                   name="current_quantity" value="{{ form_values.current_quantity|default:'0' }}" required>
                        </div>
                    </div>

                    <div class="row g-3 mt-1">
                        <div class="col-md-6">
                            <label class="form-label small text-uppercase fw-bold text-muted ms-1">Próg minimalny</label>
                            <input type="number" step="1" min="0" class="form-control form-control-lg"
                                   data-pantry-quantity-input
                                   name="minimum_quantity" value="{{ form_values.minimum_quantity|default:'0' }}" required>
                        </div>
                    </div>

                    <div class="mt-3">
                        <label class="form-label small text-uppercase fw-bold text-muted ms-1">Kup z wyprzedzeniem</label>
                        <div class="input-group input-group-lg">
                            <input type="number" min="0" class="form-control" name="restock_lead_days"
                                   value="{{ form_values.restock_lead_days|default:'3' }}" required>
                            <span class="input-group-text">dni</span>
                        </div>
                    </div>

                    <div class="form-floating mt-3">
                        <textarea class="form-control" id="notes" name="notes" placeholder="Notatki" style="height: 110px;">{{ form_values.notes|default:'' }}</textarea>
                        <label for="notes">Notatki</label>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success btn-lg rounded-pill shadow-sm fw-bold">
                            <i class="bi bi-plus-lg me-1"></i> Dodaj produkt
                        </button>
                        <a href="{% url 'cooking:pantry' %}" class="btn btn-light btn-lg rounded-pill text-muted">
                            Anuluj
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const unitSelect = document.querySelector('[data-pantry-unit-select]');
        const quantityInputs = document.querySelectorAll('[data-pantry-quantity-input]');
        const packageCountInput = document.querySelector('[data-pantry-package-count]');
        const quantityPerScanInput = document.querySelector('#quantity-per-scan');
        const totalQuantityInput = document.querySelector('[data-pantry-total-quantity]');
        const imageInput = document.querySelector('#pantry-product-image');
        const imagePicker = document.querySelector('label[for="pantry-product-image"]');
        if (!unitSelect || !quantityInputs.length) {
            return;
        }

        function syncQuantityStep() {
            const integerOnly = unitSelect.value === 'szt';
            quantityInputs.forEach((input) => {
                input.step = integerOnly ? '1' : '0.01';
                input.placeholder = integerOnly ? '0' : '0.00';
            });
        }

        unitSelect.addEventListener('change', syncQuantityStep);
        function syncTotalQuantity() {
            if (!packageCountInput || !quantityPerScanInput || !totalQuantityInput) {
                return;
            }
            const count = Number(packageCountInput.value);
            const perPackage = Number(quantityPerScanInput.value);
            if (Number.isFinite(count) && Number.isFinite(perPackage)) {
                totalQuantityInput.value = String(Math.round(count * perPackage * 100) / 100);
            }
        }

        packageCountInput?.addEventListener('input', syncTotalQuantity);
        quantityPerScanInput?.addEventListener('input', syncTotalQuantity);
        imageInput?.addEventListener('change', () => {
            const [file] = imageInput.files;
            if (file && imagePicker) {
                const title = imagePicker.querySelector('strong');
                const detail = imagePicker.querySelector('small');
                title.textContent = 'Zdjęcie gotowe';
                detail.textContent = file.name;
                imagePicker.classList.add('has-file');
            }
        });
        syncQuantityStep();
    });
</script>
{% endblock %}
