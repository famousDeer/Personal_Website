{% extends 'cooking/index.html' %}

{% block title %}Dodaj produkt do spiżarni{% endblock %}

{% block content_cooking %}
<div class="row justify-content-center">
    <div class="col-lg-7 col-xl-6">
        <div class="text-center mb-4 animate-fade-in">
            <div class="icon-box bg-success-subtle text-success mx-auto mb-3 shadow-sm"
                 style="width: 70px; height: 70px; font-size: 2rem; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <i class="bi bi-box-seam"></i>
            </div>
            <h2 class="fw-bold mb-1 recipe-title">Nowy produkt</h2>
            <p class="text-muted small mb-0">Dodaj zapas i próg uzupełnienia.</p>
        </div>

        <div class="card border-0 shadow-lg action-card animate-fade-in-up">
            <div class="card-body p-4 p-md-5">
                <form method="post">
                    {% csrf_token %}

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control fs-5 fw-bold" id="name" name="name"
                               value="{{ form_values.name|default:'' }}" placeholder="Nazwa" required>
                        <label for="name">Nazwa produktu</label>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-7">
                            <div class="form-floating">
                                <select class="form-select" id="category" name="category">
                                    <option value="">Bez kategorii</option>
                                    {% for category in categories %}
                                        <option value="{{ category }}" {% if form_values.category == category %}selected{% endif %}>{{ category }}</option>
                                    {% endfor %}
                                </select>
                                <label for="category">Kategoria</label>
                            </div>
                        </div>
                        <div class="col-md-5">
                            <div class="form-floating">
                                <select class="form-select" id="unit" name="unit" required data-pantry-unit-select>
                                    {% for value, label in units %}
                                        <option value="{{ value }}" {% if form_values.unit == value %}selected{% endif %}>{{ label }}</option>
                                    {% endfor %}
                                </select>
                                <label for="unit">Jednostka</label>
                            </div>
                        </div>
                    </div>

                    <div class="row g-3 mt-1">
                        <div class="col-md-6">
                            <label class="form-label small text-uppercase fw-bold text-muted ms-1">Aktualny stan</label>
                            <input type="number" step="1" min="0" class="form-control form-control-lg"
                                   data-pantry-quantity-input
                                   name="current_quantity" value="{{ form_values.current_quantity|default:'0' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small text-uppercase fw-bold text-muted ms-1">Próg minimalny</label>
                            <input type="number" step="1" min="0" class="form-control form-control-lg"
                                   data-pantry-quantity-input
                                   name="minimum_quantity" value="{{ form_values.minimum_quantity|default:'0' }}" required>
                        </div>
                    </div>

                    <div class="mt-3">
                        <label class="form-label small text-uppercase fw-bold text-muted ms-1">Kup z wyprzedzeniem</label>
                        <div class="input-group input-group-lg">
                            <input type="number" min="0" class="form-control" name="restock_lead_days"
                                   value="{{ form_values.restock_lead_days|default:'3' }}" required>
                            <span class="input-group-text">dni</span>
                        </div>
                    </div>

                    <div class="form-floating mt-3">
                        <textarea class="form-control" id="notes" name="notes" placeholder="Notatki" style="height: 110px;">{{ form_values.notes|default:'' }}</textarea>
                        <label for="notes">Notatki</label>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success btn-lg rounded-pill shadow-sm fw-bold">
                            <i class="bi bi-plus-lg me-1"></i> Dodaj produkt
                        </button>
                        <a href="{% url 'cooking:pantry' %}" class="btn btn-light btn-lg rounded-pill text-muted">
                            Anuluj
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const unitSelect = document.querySelector('[data-pantry-unit-select]');
        const quantityInputs = document.querySelectorAll('[data-pantry-quantity-input]');
        if (!unitSelect || !quantityInputs.length) {
            return;
        }

        function syncQuantityStep() {
            const integerOnly = unitSelect.value === 'szt';
            quantityInputs.forEach((input) => {
                input.step = integerOnly ? '1' : '0.01';
                input.placeholder = integerOnly ? '0' : '0.00';
            });
        }

        unitSelect.addEventListener('change', syncQuantityStep);
        syncQuantityStep();
    });
</script>
{% endblock %}
